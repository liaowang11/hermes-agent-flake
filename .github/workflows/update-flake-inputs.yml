name: Update flake inputs

on:
  schedule:
    - cron: '0 3 * * 5'
  workflow_dispatch:

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit-sha.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake update
      - run: |
          if git diff --quiet -- flake.lock; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "Update flake inputs"
          git push origin HEAD:main
      - id: commit-sha
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: update-lock
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            name: default
            attrs: .#packages.x86_64-linux.default
          - runner: ubuntu-24.04
            system: x86_64-linux
            name: full
            attrs: .#packages.x86_64-linux.full
          - runner: ubuntu-24.04
            system: x86_64-linux
            name: messaging
            attrs: .#packages.x86_64-linux.messaging
          - runner: ubuntu-24.04
            system: x86_64-linux
            name: tui
            attrs: .#packages.x86_64-linux.tui
          - runner: ubuntu-24.04
            system: x86_64-linux
            name: web
            attrs: .#packages.x86_64-linux.web
          - runner: macos-15
            system: aarch64-darwin
            name: default
            attrs: .#packages.aarch64-darwin.default
    name: ${{ matrix.system }}:${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-lock.outputs.commit_sha }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build --print-build-logs ${{ matrix.attrs }}
