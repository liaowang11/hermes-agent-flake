name: Update flake inputs

on:
  schedule:
    - cron: '0 3 * * 5'
  workflow_dispatch:

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake update
      - id: diff
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flake-lock
          path: flake.lock

  build:
    needs: update-lock
    if: needs.update-lock.outputs.changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            name: default
            attrs: .#packages.x86_64-linux.default
          - runner: ubuntu-24.04
            system: x86_64-linux
            name: full
            attrs: .#packages.x86_64-linux.full
          - runner: ubuntu-24.04
            system: x86_64-linux
            name: messaging
            attrs: .#packages.x86_64-linux.messaging
          - runner: ubuntu-24.04
            system: x86_64-linux
            name: tui
            attrs: .#packages.x86_64-linux.tui
          - runner: ubuntu-24.04
            system: x86_64-linux
            name: web
            attrs: .#packages.x86_64-linux.web
          - runner: macos-15
            system: aarch64-darwin
            name: default
            attrs: .#packages.aarch64-darwin.default
    name: ${{ matrix.system }}:${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flake-lock
          path: .
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed
        with:
          name: iosevka-wliao
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check --print-build-logs --system ${{ matrix.system }}
      - run: nix build --print-build-logs ${{ matrix.attrs }}

  commit:
    needs: [update-lock, build]
    if: needs.update-lock.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flake-lock
          path: .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "Update flake inputs"
          git push origin HEAD:main
